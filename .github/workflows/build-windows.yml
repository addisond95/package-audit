name: Build Windows Executable

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest -q

      - name: Run lint
        run: uv run ruff check .

      - name: Build with PyInstaller
        run: uv run pyinstaller package-audit-windows.spec --noconfirm

      - name: Zip the output
        run: Compress-Archive -Path "dist\Package Audit" -DestinationPath "Package-Audit-Windows.zip"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Package-Audit-Windows
          path: Package-Audit-Windows.zip
          retention-days: 30
