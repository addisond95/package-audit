name: Build Windows Executable

permissions:
  contents: read

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --python 3.13 --locked --group dev

      - name: Run tests
        run: uv run pytest -q

      - name: Run lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Build with PyInstaller
        run: uv run pyinstaller package-audit-windows.spec --noconfirm

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $export = Start-Process -FilePath "dist\Package Audit\Package Audit.exe" -ArgumentList "--export-smoke" -Wait -PassThru
          if ($export.ExitCode -ne 0) { exit $export.ExitCode }
          $scanner = Start-Process -FilePath "dist\Package Audit\Package Audit.exe" -ArgumentList "--scanner-smoke" -Wait -PassThru
          if ($scanner.ExitCode -ne 0) { exit $scanner.ExitCode }
          $ui = Start-Process -FilePath "dist\Package Audit\Package Audit.exe" -ArgumentList "--ui-smoke" -Wait -PassThru
          if ($ui.ExitCode -ne 0) { exit $ui.ExitCode }

      - name: Zip the output
        run: Compress-Archive -Path "dist\Package Audit" -DestinationPath "Package-Audit-Windows.zip"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Package-Audit-Windows
          path: Package-Audit-Windows.zip
          retention-days: 30
