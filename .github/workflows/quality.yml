name: Quality

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --locked --group dev

      - name: Run tests
        run: uv run pytest -q

      - name: Run scanner smoke test
        run: uv run python main.py --scanner-smoke

      - name: Run export smoke test
        run: uv run python main.py --export-smoke

      - name: Run UI smoke test
        run: uv run python main.py --ui-smoke

      - name: Run lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Scan source for common security issues
        run: uv run bandit -q -r app main.py

      - name: Audit locked dependencies
        run: uv run pip-audit

      - name: Build Python artifacts
        run: uv build
