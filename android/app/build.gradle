plugins { id 'com.android.application' }

android {
    namespace 'com.packageaudit.scanner'
    compileSdk 35
    defaultConfig {
        applicationId 'com.packageaudit.scanner'
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName '0.9.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        offline {
            def keyPath = System.getenv('PACKAGE_AUDIT_KEYSTORE')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('PACKAGE_AUDIT_KEY_PASSWORD')
                keyAlias 'package-audit'
                keyPassword System.getenv('PACKAGE_AUDIT_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('PACKAGE_AUDIT_KEYSTORE')) signingConfig signingConfigs.offline
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250107'
}
