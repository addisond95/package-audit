[project]
name = "package-audit"
version = "0.9.0"
description = "BuildingLink package audit desktop application"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["buildinglink", "package", "audit", "concierge", "property-management"]
dependencies = [
    "flask>=3.1",
    "pillow>=11.0",
    "pyside6>=6.7",
    "pymupdf>=1.24",
    "qrcode>=8.0",
    "zxing-cpp>=2.3",
    "cryptography>=46",
]

[project.scripts]
package-audit = "app.main_window:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[dependency-groups]
dev = [
    "bandit>=1.8",
    "pip-audit>=2.9",
    "pyinstaller>=6.21.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
